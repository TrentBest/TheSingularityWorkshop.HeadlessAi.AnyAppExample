<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">HeadlessAi host application flow</title><desc id="desc">The host supplies intent to a HeadlessAi agent, which uses an explicit adapter and host-owned HTTP transport to call an endpoint. Normalized output returns to the host for validation and decisions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect x="20" y="76" width="210" height="128" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Host app</text><text x="125" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">Intent + policy</text><text x="125" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">Owns decisions</text>
<rect x="300" y="76" width="220" height="128" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="410" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#4c1d95">HeadlessAi</text><text x="410" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4c1d95">Profile + adapter</text><text x="410" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4c1d95">Bounded invocation</text>
<rect x="590" y="76" width="220" height="128" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="700" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#134e4a">HTTP transport</text><text x="700" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#134e4a">Host-owned client</text><text x="700" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#134e4a">Cancellation</text>
<rect x="880" y="76" width="290" height="128" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1025" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#78350f">Configured endpoint</text><text x="1025" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#78350f">Provider protocol</text><text x="1025" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#78350f">Inference response</text>
<path d="M230 140 H290 M520 140 H580 M810 140 H870" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Output returns to the host. The host validates and decides what happens next.</text><text x="600" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Default demo: deterministic local fixture • Live provider call: explicit opt-in</text>
</svg>